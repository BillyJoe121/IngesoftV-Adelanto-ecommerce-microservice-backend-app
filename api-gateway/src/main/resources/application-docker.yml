server:
  port: 8080

spring:
  zipkin:
    base-url: http://zipkin-container:9411/
  config:
    import: optional:configserver:http://cloud-config-container:9296

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery-container:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: api-gateway-container
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org:
      springframework:
        web: INFO
