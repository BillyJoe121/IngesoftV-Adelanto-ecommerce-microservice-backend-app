server:
  port: 9296

spring:
  zipkin:
    base-url: http://zipkin-container:9411/
  cloud:
    config:
      server:
        git:
          uri: https://github.com/SelimHorri/cloud-config-server
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery-container:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: cloud-config-container
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org:
      springframework:
        web: INFO
