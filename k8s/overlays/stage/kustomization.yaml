apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-stage

resources:
  - ../../base

labels:
  - pairs:
      environment: staging
    includeSelectors: true

# Configuración específica para staging - 2 réplicas para servicios críticos
replicas:
  - name: service-discovery
    count: 1
  - name: cloud-config
    count: 1
  - name: api-gateway
    count: 2
  - name: user-service
    count: 2
  - name: product-service
    count: 2
  - name: order-service
    count: 2
  - name: payment-service
    count: 2
  - name: shipping-service
    count: 1
  - name: favourite-service
    count: 1
